{% extends "base.html" %}

{% block title %}Register - AI Zone বাংলা{% endblock %}

{% block content %}

<section class="page-header">

    <h1>👤 Create Account</h1>

    <p>
        AI Zone বাংলায় নতুন account তৈরি করুন
    </p>

</section>


<section class="section">

    <div class="auth-box">

        <form method="POST">

            <label for="username">
                👤 Username
            </label>

            <input
                id="username"
                type="text"
                name="username"
                placeholder="আপনার Username"
                autocomplete="username"
                required>


            <label for="email">
                📧 Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                placeholder="আপনার Email"
                autocomplete="email"
                required>


            <label for="password">
                🔑 Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="কমপক্ষে 6 characters"
                minlength="6"
                autocomplete="new-password"
                required>


            <button type="submit">
                🚀 Create Account
            </button>

        </form>


        <p class="auth-footer">

            ইতিমধ্যে Account আছে?

            <a href="/login">
                Login করুন
            </a>

        </p>

    </div>

</section>

{% endblock %}
