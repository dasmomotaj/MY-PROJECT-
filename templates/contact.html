
{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}

<section class="page-header">

<h1>📩 Contact</h1>

<p>আপনার message পাঠান</p>

</section>

<section class="section">

<div class="contact-box">

{% if message %}

<div class="success">
{{ message }}
</div>

{% endif %}

<form method="POST">

<input
type="text"
name="name"
placeholder="আপনার নাম"
required
>

<input
type="email"
name="email"
placeholder="আপনার Email"
required
>

<textarea
name="message"
placeholder="আপনার Message"
rows="6"
required
></textarea>

<button type="submit">
Send Message 🚀
</button>

</form>

</div>

</section>

{% endblock %}
