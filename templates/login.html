{% extends "base.html" %}

{% block title %}Login - AI Zone বাংলা{% endblock %}

{% block content %}

<section class="page-header">

    <h1>🔐 Login</h1>

    <p>
        AI Zone বাংলায় আপনার account-এ প্রবেশ করুন
    </p>

</section>


<section class="section">

    <div class="auth-box">

        <form method="POST">

            <label for="email">
                📧 Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                placeholder="আপনার Email লিখুন"
                autocomplete="email"
                required>


            <label for="password">
                🔑 Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="আপনার Password লিখুন"
                autocomplete="current-password"
                required>


            <button type="submit">
                🔐 Login
            </button>

        </form>


        <p class="auth-footer">

            Account নেই?

            <a href="/register">
                নতুন Account তৈরি করুন
            </a>

        </p>

    </div>

</section>

{% endblock %}
