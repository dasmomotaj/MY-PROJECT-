{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="page-header">
<h1>🔐 Login</h1>
</section>

<section class="section">

<div class="auth-box">

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p>
No account?
<a href="/register">Register</a>
</p>

</div>

</section>

{% endblock %}
